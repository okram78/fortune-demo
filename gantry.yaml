apiVersion: gantryci.dev/v1alpha1
kind: Project
metadata:
  name: fortune-demo
spec:
  repository:
    provider: github
    owner: okram78
    name: fortune-demo
  services:
    - name: fortune
      source:
        path: .
      build:
        strategy: buildpacks
        builder: paketobuildpacks/ubuntu-noble-builder
        buildpacks:
          - paketo-buildpacks/java
        env:
          BP_JVM_VERSION: "25"
          BP_GRADLE_BUILD_ARGUMENTS: "--no-daemon -Dorg.gradle.welcome=never clean bootJar"
        extensions:
          - .buildpacks/fortune-runtime
      container:
        port: 12500
      health:
        path: /healthz
  web:
    - name: fortune-web
      source:
        path: frontend
      build:
        strategy: dockerfile
        file: Dockerfile
      container:
        port: 80
      health:
        path: /
      routes:
        - host: fortune.localhost
          path: /
  environments:
    - name: dev
      target:
        type: localhost
        runtime: docker-compose
        gateway: nginx
        gatewayPort: 8080
      deploy:
        trigger: manual
