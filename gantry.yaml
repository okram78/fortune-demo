apiVersion: gantryci.dev/v1alpha1
kind: Project
metadata:
  name: fortune-demo
spec:
  repository:
    provider: github
    owner: okram78
    name: fortune-demo
  support:
    - name: postgres
      type: postgresql
      version: "16"
      database:
        name: fortune
        user: fortune
        passwordSecretRef: fortune-postgres-password
  services:
    - name: fortune
      source:
        path: .
      build:
        strategy: buildpacks
        builder: paketobuildpacks/ubuntu-noble-builder
        buildpacks:
          - paketo-buildpacks/java
        env:
          BP_JVM_VERSION: "25"
          BP_GRADLE_BUILD_ARGUMENTS: "--no-daemon -Dorg.gradle.welcome=never clean bootJar"
        extensions:
          - .buildpacks/fortune-runtime
      container:
        port: 12500
      health:
        path: /healthz
      connections:
        - name: database
          target: postgres
          variables:
            host: DB_HOST
            port: DB_PORT
            database: DB_NAME
            username: DB_USERNAME
            password:
              name: DB_PASSWORD
              delivery: environment
  web:
    - name: fortune-web
      source:
        path: frontend
      build:
        strategy: dockerfile
        file: Dockerfile
      container:
        port: 80
      health:
        path: /
      dependsOn:
        - name: fortune
          condition: healthy
      routes:
        - host: fortune.localhost
          path: /
  environments:
    - name: dev
      target:
        type: localhost
        runtime: kubernetes
        gateway: haproxy
        ingressClassName: haproxy
        namespace: fortune-demo-dev
      deploy:
        trigger: manual
